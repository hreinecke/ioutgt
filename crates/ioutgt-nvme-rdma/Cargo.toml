[package]
name = "ioutgt-nvme-rdma"
description = "NVMe/RDMA transport for the ioutgt target (RoCE / InfiniBand via ibverbs)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
ioutgt-core = { workspace = true }
ioutgt-backend = { workspace = true }
# Shared backend builder + JSON config (memory/null/file), reused by the binary
# so `--backend`/`--config` match the ioutgt-nvme-tcp binary.
ioutgt-control = { workspace = true }
# The transport-neutral queue-thread pool / control-loop / control API: the
# RDMA Transport impl plugs into it (multi-thread, pinning, ctl/list/stat).
ioutgt-harness = { workspace = true }
ioutgt-nvme = { workspace = true }
ioutgt-uring = { workspace = true }
# Safe, maintained ibverbs + RDMA-CM bindings that link the system rdma-core
# (no vendored build, no libnl-devel) and expose the completion-channel fd we
# register in io_uring. (ibverbs-sys vendors rdma-core via cmake/libnl;
# rdma-sys pins a bindgen too old for modern rdma-core headers — both unusable
# here, see docs/nvme-rdma.md.)
sideway = { workspace = true }
# Raw FFI for the CQ-event calls sideway does not wrap (req_notify/get/ack).
rdma-mummy-sys = { workspace = true }
os_socketaddr = "0.2"
libc = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zerocopy = { workspace = true }
clap = { workspace = true }
# `spawn_local`/`JoinSet` per-command tasks, `select!`, and `sync` (mpsc/oneshot
# bridge from the dedicated CM thread to the harness control thread).
tokio = { workspace = true, features = ["rt", "macros", "sync"] }

[[bin]]
name = "ioutgt-nvme-rdma"
path = "src/main.rs"

[dev-dependencies]
# `tokio::select!` / `#[allow]`-free macros in the reactor loopback tests.
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
