[package]
name = "ioutgt"
description = "High-performance io_uring-based NVMe/TCP target"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

# The binary is transport-named (ioutgt-nvme-tcp) so a future
# ioutgt-nvme-rdma can sit beside it; the library stays `ioutgt`.
[[bin]]
name = "ioutgt-nvme-tcp"
path = "src/main.rs"

[dependencies]
ioutgt-backend = { workspace = true }
ioutgt-control = { workspace = true }
ioutgt-core = { workspace = true }
ioutgt-harness = { workspace = true }
ioutgt-nvme-tcp = { workspace = true }
ioutgt-uring = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "io-util", "time", "macros", "sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# The in-process integration test client speaks the sans-IO NVMe codec.
ioutgt-nvme = { workspace = true }
libc = { workspace = true }
zerocopy = { workspace = true }

[lints]
workspace = true
