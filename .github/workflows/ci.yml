name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rdma-mummy-sys generates its bindings against the system rdma-core
      # headers at build time, and its bindgen (0.66) mis-generates the
      # pthread-embedding ibv_* structs against libclang >= 22 (opaque
      # `_address`-only fields, E0609 "no field" — see README Requirements
      # and RDMA-Rust/rdma-mummy-sys#24). Pin libclang 19 explicitly; the
      # runner image's default libclang is newer.
      - name: install rdma-core headers + libclang 19
        run: |
          sudo apt-get update
          sudo apt-get install -y libibverbs-dev librdmacm-dev
          sudo apt-get install -y libclang-19-dev || {
            wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
            sudo bash /tmp/llvm.sh 19
          }
          echo "LIBCLANG_PATH=/usr/lib/llvm-19/lib" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  msrv:
    name: MSRV (1.88) check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install rdma-core headers + libclang 19
        run: |
          sudo apt-get update
          sudo apt-get install -y libibverbs-dev librdmacm-dev
          sudo apt-get install -y libclang-19-dev || {
            wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
            sudo bash /tmp/llvm.sh 19
          }
          echo "LIBCLANG_PATH=/usr/lib/llvm-19/lib" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  test:
    name: workspace tests
    # The suite's io_uring floor includes incremental provided-buffer rings
    # (IOU_PBUF_RING_INC, kernel >= 6.12); the 24.04 runner image tops out at
    # kernel 6.11, so ride the newest image for its kernel. If this label ever
    # disappears, move to the newest available Ubuntu image with a >= 6.12
    # kernel.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - run: uname -r
      - name: install rdma-core + libclang 19
        run: |
          sudo apt-get update
          sudo apt-get install -y libibverbs-dev librdmacm-dev rdma-core
          sudo apt-get install -y libclang-19-dev || {
            wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
            sudo bash /tmp/llvm.sh 19
          }
          echo "LIBCLANG_PATH=/usr/lib/llvm-19/lib" >> "$GITHUB_ENV"
      # Best effort: a soft-RoCE device makes the rxe gates run for real;
      # without it (module absent on most cloud kernels) they skip cleanly —
      # the suite treats "no RDMA device with an active port" as an
      # environment condition, not a failure.
      - name: soft-RoCE (best effort)
        run: |
          if sudo modprobe rdma_rxe 2>/dev/null; then
            dev="$(ip -o -4 route show to default | awk '{print $5; exit}')"
            sudo rdma link add rxe0 type rxe netdev "$dev" && rdma link show
          else
            echo "rdma_rxe unavailable; rxe gates will skip"
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # TEMPORARY diagnostics for the rxe QP-create EINVAL seen on this
      # image (the same tests pass on Fedora 43 / kernel 7.0 rxe and in the
      # VM gate). Captures kernel/userspace versions, device caps, a
      # basic-QP pingpong control, and an strace of the failing test: a
      # kernel-side EINVAL shows as a failing uverbs ioctl/write/mmap in
      # the trace; a userspace librxe rejection shows no failing syscall.
      # Never fails the job — the cargo test step below stays the gate.
      - name: rxe diagnostics (best effort)
        run: |
          set +e
          sudo apt-get install -y strace ibverbs-utils >/dev/null 2>&1
          echo "== versions =="
          uname -r
          dpkg -l | grep -E "rdma-core|ibverbs|infiniband" || true
          echo "== rdma link =="
          rdma link show || true
          echo "== ibv_devinfo =="
          ibv_devinfo -v 2>&1 | head -60 || true
          echo "== basic-QP pingpong control =="
          (ibv_rc_pingpong -d rxe0 -g 1 >/tmp/pp-server.log 2>&1 &)
          sleep 1
          if ibv_rc_pingpong -d rxe0 -g 1 127.0.0.1 >/tmp/pp-client.log 2>&1; then
            echo "basic-QP pingpong OK"
          else
            echo "basic-QP pingpong FAILED:"
            tail -3 /tmp/pp-server.log /tmp/pp-client.log
          fi
          echo "== strace of rxe_loopback_send_write_read =="
          BIN=$(cargo test -p ioutgt-nvme-rdma --lib --no-run --message-format=json 2>/dev/null \
            | jq -r 'select(.executable != null) | .executable' | grep ioutgt_nvme_rdma | head -1)
          echo "test binary: $BIN"
          strace -f -e trace=openat,read,write,ioctl,mmap -o /tmp/rxe.strace \
            "$BIN" rxe_loopback_send_write_read --test-threads=1 --nocapture || true
          echo "-- syscalls returning EINVAL --"
          grep -n "EINVAL" /tmp/rxe.strace | tail -10 || echo "(none — EINVAL originated in userspace librxe)"
          echo "-- strace tail --"
          tail -30 /tmp/rxe.strace
          true
      - run: cargo test --workspace
